apiVersion: 1

datasources:
  - name: dongsoop-usage
    uid: dongsoop-usage
    type: elasticsearch
    access: proxy
    url: ${ES_URL}
    isDefault: true
    editable: false
    jsonData:
      # 와일드카드 인덱스에는 interval(월별 인덱스 패턴) 옵션을 같이 주면 안 된다. 주면 "invalid index pattern"
      index: "api-usage-*"
      timeField: "@timestamp"
      timeInterval: "1m"
      logMessageField: uri
      maxConcurrentShardRequests: 5
