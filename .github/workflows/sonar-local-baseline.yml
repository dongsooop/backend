name: Sonar Local Baseline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Start SonarQube Community Build
        run: |
          docker run -d --name sonarqube -p 9000:9000 sonarqube:community

          for i in {1..90}; do
            STATUS=$(curl -fsS http://localhost:9000/api/system/status 2>/dev/null | jq -r '.status // empty' || true)
            if [ "$STATUS" = "UP" ]; then
              echo "SonarQube is ready"
              exit 0
            fi
            sleep 5
          done

          docker logs sonarqube
          exit 1

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew test classes

      - name: Generate Sonar token
        id: sonar-token
        run: |
          TOKEN=$(curl -fsS -u admin:admin -X POST \
            'http://localhost:9000/api/user_tokens/generate?name=github-actions-baseline' \
            | jq -r '.token')
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$TOKEN"

      - name: Run Sonar analysis
        env:
          SONAR_TOKEN: ${{ steps.sonar-token.outputs.token }}
        run: |
          ./gradlew sonar \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.projectKey=dongsooop-backend-baseline

      - name: Print baseline metrics
        env:
          SONAR_TOKEN: ${{ steps.sonar-token.outputs.token }}
        run: |
          echo '===== SONAR BASELINE METRICS ====='
          curl -fsS -u "$SONAR_TOKEN:" \
            'http://localhost:9000/api/measures/component?component=dongsooop-backend-baseline&metricKeys=bugs,vulnerabilities,code_smells,security_hotspots,duplicated_lines_density,ncloc,cognitive_complexity,complexity,reliability_rating,security_rating,sqale_rating,coverage' \
            | jq -r '.component.measures[] | "\(.metric)=\(.value // "n/a")"' \
            | sort

          echo '===== ISSUE SEVERITY COUNTS ====='
          curl -fsS -u "$SONAR_TOKEN:" \
            'http://localhost:9000/api/issues/search?componentKeys=dongsooop-backend-baseline&facets=severities&ps=1' \
            | jq -r '.facets[] | select(.property == "severities") | .values[] | "\(.val)=\(.count)"' \
            | sort

          echo '===== ISSUE TYPE COUNTS ====='
          curl -fsS -u "$SONAR_TOKEN:" \
            'http://localhost:9000/api/issues/search?componentKeys=dongsooop-backend-baseline&facets=types&ps=1' \
            | jq -r '.facets[] | select(.property == "types") | .values[] | "\(.val)=\(.count)"' \
            | sort
