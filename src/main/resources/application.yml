spring:
  application:
    name: dongsoop
  profiles:
    group:
      local: local
      prod: prod
    default: local

logging:
  config: classpath:logback.xml
  file.path: logs/dongsoop.log

rest:
  connectTimeout: 4000
  readTimeout: 4000

eclass:
  base-url: https://eclass.dongyang.ac.kr
  user-agent: "Mozilla/5.0 (Compatible; DongsoopEclass/1.0)"
  connect-timeout-ms: 5000
  read-timeout-ms: 15000
  sync:
    cron: "0 30 6,12,18 * * *"
    window-past-days: 1
    window-future-days: 30
    # 제출 여부는 리마인드가 나가는 기간만 확인한다 — 마감이 먼 과제까지 매번 물으면
    # 이클래스 호출량이 3배로 뛴다
    submission-check-days: 3
    # 리마인드 창 밖 과제는 이 시간마다 한 번만 제출 여부를 다시 묻는다 (앱 목록의 제출 표시용)
    submission-recheck-hours: 24
    thread-count: 2
    request-delay-ms: 300
    manual-request-delay-ms: 100   # 수동 새로고침(POST /eclass/sync)은 사용자가 기다리므로 짧게
    abort-failure-ratio: 0.5
    manual-cooldown-seconds: 20   # 화면 진입·포그라운드 복귀마다 부를 수 있게 짧게. 그 안의 재호출은 429
    relink-timeout-hours: 24
  reminder:
    cron: "0 0 8 * * *"
    days-before: 3,1,0
    course-name-max-length: 20

authentication:
  path:
    all:
      /tutoring-board/**,
      /project-board/**,
      /study-board/**,
      /marketplace-board/**,
      /member/login,
      /member/signup,
      /member/validate/**,
      /member/password,
      /meal/current,
      /meal/prices,
      /error,
      /ws/**,
      /notice/**,
      /v2/notice/**,
      /timetable/**,
      /token/reissue,
      /search/**,
      /mail-verify/**,
      /device,
      /subscribe-department,
      /schedule/**,
      /home,
      /feedback,
      /health,
      /restaurants/nearby,
      /notification-settings/**,
      /oauth2/kakao,
      /oauth2/google,
      /oauth2/apple,
      /oauth2/apple/callback,
      /web-app-check,
      /eclass/**
    user:
      /test/user,
      /notice/keywords,
      /notice/keywords/**
    admin:
      /admin
  origins:
    http://localhost:3000,
    http://dongsoop.site,
    https://dongsoop.site,
    https://appleid.apple.com
  methods:
    POST,
    GET,
    PATCH,
    PUT,
    DELETE,
    OPTIONS
  filter:
    ignore:
      paths:
        /error,
        /member/login,
        /member/signup,
        /mail-verify/**,
        /oauth2/authorization,
        /ws/**,
        /web-app-check

oauth:
  apple:
    issuer: https://appleid.apple.com
    revoke-uri: https://appleid.apple.com/auth/revoke
  google:
    revoke-uri: https://oauth2.googleapis.com/revoke
  kakao:
    revoke-uri: https://kapi.kakao.com/v1/user/unlink
    target-id-type: user_id
    mobile-token-value: mobile

university:
  domain: https://www.dongyang.ac.kr

notice:
  link:
    layout-header: ?layout=unknown
    department:
      notice-regex: "'([^' ]*)'"
      url-prefix: /combBbs
      url-start: javascript
      url-suffix: /view.do
  thread:
    count: 8
  connect:
    timeout: 15000
    user-agent: "Mozilla/5.0 (Compatible; NoticeBot/1.0)"
  crawl:
    timeout: 10000
  terminate:
    grace-time: 30
    force-time: 10

meal:
  crawler:
    base-url: "https://www.dongyang.ac.kr/dmu/4902/subview.do?enc="
    timeout: 15000 # 15 seconds
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  # 학교 페이지에는 가격이 없어 여기서 관리한다. days 는 판매 요일(월~금), 비우면 매일
  prices:
    ticket-price: 6500 # 한식 식권
    categories:
      - name: 돈까스류
        note: 공기밥 포함
        items:
          - { name: 돈까스, price: 5000 }
          - { name: 치킨까스, price: 5200 }
          - { name: 치즈돈까스, price: 5500 }
          - { name: 수제왕돈까스, price: 6000 }
          - { name: 고구마치즈돈까스, price: 6000 }
      - name: 라면류
        note: 공기밥 포함
        items:
          - { name: 신라면, price: 3500 }
          - { name: 참깨라면, price: 3500 }
          - { name: 짜파게티, price: 3500 }
          - { name: 불닭볶음면, price: 3500 }
          - { name: 투움바, price: 3700 }
          - { name: 치즈라면, price: 4000 }
          - { name: 짜계치, price: 4000 }
          - { name: 불계치, price: 4000 }
          - { name: 해물짬뽕라면, price: 4500 }
      - name: 덮밥류
        note: 요일별로 메뉴가 상이합니다
        items:
          - { name: 김치볶음밥, price: 4900, large-price: 5900, days: [월, 금] }
          - { name: 눈꽃치즈김치볶음밥, price: 5900, days: [월, 금] }
          - { name: 참치마요덮밥, price: 4900, days: [화] }
          - { name: 고추참치마요덮밥, price: 4900, days: [화] }
          - { name: 삼겹살덮밥, price: 5500, large-price: 7500, days: [수] }
          - { name: 치킨마요덮밥, price: 4900, days: [목] }
          - { name: 불닭마요덮밥, price: 4900, days: [목] }
      - name: 음료류
        items:
          - { name: 코카콜라, price: 1500 }
          - { name: 코카콜라 제로, price: 1500 }
          - { name: 사이다, price: 1500 }
          - { name: 환타 오렌지, price: 1500 }
          - { name: 환타 파인애플, price: 1500 }

resource:
  static:
    base-path: static/

mail:
  login-notification:
    template: login-notification-mail.html

blinddate:
  event-message-amount: 3

recaptcha:
  verify-url: https://www.google.com/recaptcha/api/siteverify
  score-threshold: 0.5

monitoring:
  usage:
    enabled: false           # 요청 기록을 ES에 쌓을지. ES 없는 로컬·테스트는 끈다
    retention-months: 0      # 0이면 삭제하지 않고 계속 보관. N이면 N개월보다 오래된 월 인덱스를 매일 새벽 삭제
    # 앱이 시작할 때 자동으로 부르는 경로. 기능 'system' 으로 묶여 기능별 사용자 순위에서 빠진다 (총 호출 수에는 포함)
    system-uris: /token/**, /device, /device/**, /reports/sanction-status, /web-app-check
    # 사용자 수에서 뺄 회원 ID (관리자·봇). 쉼표 구분
    exclude-member-ids: ""
  discord:
    webhook-url: ""          # 비어 있으면 주간 리포트를 보내지 않는다
