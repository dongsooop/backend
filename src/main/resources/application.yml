spring:
  application:
    name: dongsoop
  profiles:
    group:
      local: local
      prod: prod
    default: local

logging:
  config: classpath:logback.xml
  file.path: logs/dongsoop.log

rest:
  connectTimeout: 4000
  readTimeout: 4000

eclass:
  base-url: https://eclass.dongyang.ac.kr
  user-agent: "Mozilla/5.0 (Compatible; DongsoopEclass/1.0)"
  connect-timeout-ms: 5000
  read-timeout-ms: 15000
  sync:
    cron: "0 30 6,12,18 * * *"
    window-past-days: 1
    window-future-days: 30
    # 제출 여부는 리마인드가 나가는 기간만 확인한다 — 마감이 먼 과제까지 매번 물으면
    # 이클래스 호출량이 3배로 뛴다
    submission-check-days: 3
    thread-count: 2
    request-delay-ms: 300
    abort-failure-ratio: 0.5
    manual-cooldown-seconds: 60
    relink-timeout-hours: 24
  reminder:
    cron: "0 0 8 * * *"
    days-before: 3,1,0
    course-name-max-length: 20

authentication:
  path:
    all:
      /tutoring-board/**,
      /project-board/**,
      /study-board/**,
      /marketplace-board/**,
      /member/login,
      /member/signup,
      /member/validate/**,
      /member/password,
      /meal/current,
      /error,
      /ws/**,
      /notice/**,
      /v2/notice/**,
      /timetable/**,
      /token/reissue,
      /search/**,
      /mail-verify/**,
      /device,
      /subscribe-department,
      /schedule/**,
      /home,
      /feedback,
      /health,
      /restaurants/nearby,
      /notification-settings/**,
      /oauth2/kakao,
      /oauth2/google,
      /oauth2/apple,
      /oauth2/apple/callback,
      /web-app-check,
      /eclass/**
    user:
      /test/user,
      /notice/keywords,
      /notice/keywords/**
    admin:
      /admin
  origins:
    http://localhost:3000,
    http://dongsoop.site,
    https://dongsoop.site,
    https://appleid.apple.com
  methods:
    POST,
    GET,
    PATCH,
    PUT,
    DELETE,
    OPTIONS
  filter:
    ignore:
      paths:
        /error,
        /member/login,
        /member/signup,
        /mail-verify/**,
        /oauth2/authorization,
        /ws/**,
        /web-app-check

oauth:
  apple:
    issuer: https://appleid.apple.com
    revoke-uri: https://appleid.apple.com/auth/revoke
  google:
    revoke-uri: https://oauth2.googleapis.com/revoke
  kakao:
    revoke-uri: https://kapi.kakao.com/v1/user/unlink
    target-id-type: user_id
    mobile-token-value: mobile

university:
  domain: https://www.dongyang.ac.kr

notice:
  link:
    layout-header: ?layout=unknown
    department:
      notice-regex: "'([^' ]*)'"
      url-prefix: /combBbs
      url-start: javascript
      url-suffix: /view.do
  thread:
    count: 8
  connect:
    timeout: 15000
    user-agent: "Mozilla/5.0 (Compatible; NoticeBot/1.0)"
  crawl:
    timeout: 10000
  terminate:
    grace-time: 30
    force-time: 10

meal:
  crawler:
    base-url: "https://www.dongyang.ac.kr/dmu/4902/subview.do?enc="
    timeout: 15000 # 15 seconds
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

resource:
  static:
    base-path: static/

mail:
  login-notification:
    template: login-notification-mail.html

blinddate:
  event-message-amount: 3

recaptcha:
  verify-url: https://www.google.com/recaptcha/api/siteverify
  score-threshold: 0.5

monitoring:
  usage:
    enabled: false           # 요청 기록을 ES에 쌓을지. ES 없는 로컬·테스트는 끈다
    retention-months: 3      # 이 달수보다 오래된 api-usage-* 월 인덱스는 매일 새벽 삭제
    # 앱이 시작할 때 자동으로 부르는 경로. 기능 'system' 으로 묶여 기능별 사용자 순위에서 빠진다 (총 호출 수에는 포함)
    system-uris: /token/**, /device, /device/**, /reports/sanction-status, /web-app-check
    # 사용자 수에서 뺄 회원 ID (관리자·봇). 쉼표 구분
    exclude-member-ids: ""
  discord:
    webhook-url: ""          # 비어 있으면 주간 리포트를 보내지 않는다
