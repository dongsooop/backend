# 학식 가격표. 학교 페이지에는 가격이 없어 여기서 관리한다 (application.yml 에서 spring.config.import 로 읽는다)
# days 는 판매 요일(월~금), 비우면 매일. 값을 고치면 MealPricePropertiesTest 도 같이 맞춘다
